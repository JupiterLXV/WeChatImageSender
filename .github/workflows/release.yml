name: Windows checks and release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run offline sending demonstration
        shell: pwsh
        run: |
          python main.py --demo --headless
          if ($LASTEXITCODE -ne 0) { throw 'Offline demonstration failed.' }

      - name: Test and package Windows application
        shell: pwsh
        run: |
          $version = '3.6.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          }
          ./build.ps1 -Version $version

      - name: Upload portable application and checksum
        uses: actions/upload-artifact@v4
        with:
          name: WeChatImageSender-Windows-x64
          if-no-files-found: error
          path: |
            releases/**/*.zip
            releases/**/*.zip.sha256

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download verified Windows package
        uses: actions/download-artifact@v4
        with:
          name: WeChatImageSender-Windows-x64
          path: artifacts

      - name: Publish the version tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $files = @(Get-ChildItem -LiteralPath artifacts -Recurse -File |
            Where-Object { $_.Name -match '\.zip(\.sha256)?$' } |
            Select-Object -ExpandProperty FullName)
          if ($files.Count -lt 2) { throw 'Release package or checksum is missing.' }
          gh release create $env:RELEASE_TAG @files --verify-tag `
            --title "WeChatImageSender $env:RELEASE_TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
